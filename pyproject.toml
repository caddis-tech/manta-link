[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "manta-link"
version = "0.9.0"
description = "The single Pi-side process that owns the Aquadrone Pico's serial port"
requires-python = ">=3.11"
# Pinned exactly, including requests' own closure. The image is built for
# linux/arm/v7 through QEMU, and a resolver that picks a different wheel there
# than it picked here is a difference nobody sees until a boat will not start
# over a cellular link. Every name here must also appear in the Dockerfile's pip
# line; tests/test_manifest.py checks that, because CI installs this file and
# never runs the image.
dependencies = [
    "pyserial==3.5",
    "requests==2.34.2",
    "certifi==2026.7.22",
    "charset-normalizer==3.4.9",
    "idna==3.18",
    "urllib3==2.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "types-requests"]

[tool.setuptools]
packages = ["manta_link"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
# Checked as Linux regardless of where it runs. The container is armv7 Linux,
# and fcntl/termios do not exist on the Windows box this is developed on, so a
# host-platform check would report errors about the only platform that matters.
platform = "linux"
warn_unused_ignores = true
warn_redundant_casts = true
# pyserial ships no stubs, and vendoring a partial set would be worse than
# letting the one import be untyped.
[[tool.mypy.overrides]]
module = ["serial.*"]
ignore_missing_imports = true
